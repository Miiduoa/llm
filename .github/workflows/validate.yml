name: validate

on:
  push:
  pull_request:

concurrency:
  group: llm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r requirements-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.config_check
      - run: python src/data/prepare.py
      - run: python -m src.config_check --jsonl data/combined/train.jsonl
